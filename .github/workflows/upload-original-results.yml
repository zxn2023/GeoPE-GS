                  target = Path('results') / rel
                  assert target.resolve().is_relative_to(Path('results').resolve())
                  data = z.read(info)
                  name = target.as_posix()
                  assert name in expected
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == expected[name], name
